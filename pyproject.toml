[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.0.0"
description = "Configurable RAG pipeline + evaluation harness (UTS Honours research artefact)"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Hai Nam Truong" }]

# Runtime dependencies are added phase by phase. Phase 1 (ingestion) adds beautifulsoup4
# for HTML parsing (affordance extraction), requests for the static crawler's HTTP
# transport (docs/04 §2 static.py: "requests + bs4 fallback"), and playwright for the
# JS-rendering backend (P1-2). Phase 2 (chunking) adds langchain-text-splitters — used, and
# ONLY inside ingestion/chunking/recursive.py, per OD-2. No other LangChain surface.
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "playwright>=1.40,<2",
    "langchain-text-splitters>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6,<7",
    "types-requests>=2.31,<3",
]

# SPIKE extra — the thin vertical slice's runtime deps (embedding + Qdrant client). Kept
# out of the core deps because they are heavy and the pure spike modules (chunking,
# metrics) and their unit tests do not need them. Install with `pip install -e ".[dev,slice]"`
# to run `python -m chatbot.spike.run`.
slice = [
    "qdrant-client>=1.7,<2",
    "sentence-transformers>=2.5,<4",
]

[project.scripts]
# Convenience alias; the documented entry point is `python -m chatbot.config`.
chatbot-config = "chatbot.config.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Boring, well-trodden rule set: pycodestyle, pyflakes, isort, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# bs4 ships no py.typed; yaml's stubs are not installed. The spike extra deps
# (qdrant-client, sentence-transformers) are not installed in the lint/test env at all.
# All are used behind our own typed wrappers, so silence missing-import without loosening
# our code.
module = ["yaml", "bs4", "qdrant_client", "qdrant_client.*", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# src layout: put the package on the path for tests without requiring an install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"