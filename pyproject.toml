[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.0.0"
description = "Configurable RAG pipeline + evaluation harness (UTS Honours research artefact)"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Hai Nam Truong" }]

# Runtime dependencies are added phase by phase. Phase 1 (ingestion) adds beautifulsoup4
# for HTML parsing (affordance extraction), requests for the static crawler's HTTP
# transport (docs/04 §2 static.py: "requests + bs4 fallback"), and playwright for the
# JS-rendering backend (P1-2). No LangChain — OD-2 confines it to the recursive chunker.
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6,<7",
    "types-requests>=2.31,<3",
]

[project.scripts]
# Convenience alias; the documented entry point is `python -m chatbot.config`.
chatbot-config = "chatbot.config.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Boring, well-trodden rule set: pycodestyle, pyflakes, isort, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# bs4 ships no py.typed; yaml's stubs are not installed. Both are used behind our own
# typed wrappers, so silence the missing-import error without loosening our code.
module = ["yaml", "bs4"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# src layout: put the package on the path for tests without requiring an install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"