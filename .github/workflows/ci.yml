name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # NFR-05: lint must be clean. NFR-04: tests run with no network, no services.
      - name: Lint
        run: |
          ruff check src tests
          mypy

      - name: Test
        run: pytest