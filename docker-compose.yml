# Backing services for local development (`make services`).
#
# Postgres holds conversation history (Phase 8, OD-16 — the live store; Redis and
# summary-on-end are deferred). Qdrant holds the vectors. Ollama (the LLM) is run
# separately, on the host, because it needs the machine's GPU.
#
# The Postgres defaults match the DSN default in store/conversation.py:
#   postgresql://chatbot@localhost:5432/chatbot
# Trust auth is fine for a single-machine research prototype and keeps the DSN
# password-free; do not expose this container beyond localhost.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_DB: chatbot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - chatbot_qdrant:/qdrant/storage

volumes:
  chatbot_pgdata:
  chatbot_qdrant:
