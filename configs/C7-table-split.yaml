id: C7-table-split
extends: C0-baseline
description: >
  Single-rule isolation WITHIN typed. Flips only `table_handling` from header_repeat to
  split, holding every other typed behaviour identical to C0. Isolates the table rule
  alone — the contribution of keeping a table's rows grouped under a repeated caption and
  header versus emitting one chunk per row. Verify with
  `python -m chatbot.config diff C0-baseline C7-table-split`.
# rq is provisional per OD-4 (open): chunking is treated as an RQ1 sub-question for now, and
# may be promoted to a fifth RQ if its effect exceeds C0 vs C2. Metadata only (not hashed).
rq: [1]
overrides:
  chunking:
    table_handling: split
